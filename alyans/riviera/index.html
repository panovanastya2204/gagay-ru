<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>ЖК «Ривьера» — 3D-генплан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#2D3C55;--navy-tint:#E6EAF1;--ink:#1D2432;--muted:#667085;--card:#fff;--line:#E2E0DA;
  --shadow:0 1px 2px rgba(29,36,50,.08),0 8px 24px rgba(29,36,50,.14);--ok:#2F8F5B;--wip:#C77A1A}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#dfe9ee;color:var(--ink);
  font:14px/1.4 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.pin{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  will-change:transform;transition:opacity .2s}
.pin .b{min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:#fff;color:var(--navy);font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 2px 8px rgba(29,36,50,.28);border:2px solid #fff;white-space:nowrap}
.pin .b small{font-weight:600;font-size:10px;color:var(--muted);letter-spacing:.02em}
.pin.wip .b{background:var(--navy);color:#fff;border-color:#fff}
.pin.wip .b small{color:#C9D3E4}
.pin::after{content:"";width:2px;height:14px;background:#fff;box-shadow:0 2px 4px rgba(29,36,50,.3)}
.pin.infra .b{background:var(--navy);color:#fff;min-width:30px;height:30px;padding:0;border-radius:50%}
.pin.infra svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pin.p .b{min-width:20px;height:20px;border-radius:5px;font-size:11px;padding:0;background:#fff;color:#2b62c4;border:1.5px solid #2b62c4;box-shadow:none}
.pin.p::after{display:none}
.pin.p{pointer-events:none}
.pin.home .b{height:28px;font-size:12px;font-weight:600;padding:0 10px}
.pin.navy .b{background:#0F3F66;color:#fff}
.pin.bronze .b{background:#A8742C;color:#fff}
.pin.street{pointer-events:none}.pin.street::after{display:none}
.pin.street .b{min-width:0;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;background:rgba(15,63,102,.82);color:#fff;border:0;box-shadow:none}
.pin.sel .b{background:#F2C14E;color:var(--ink);border-color:#fff}
.pin.sel .b small{color:var(--ink)}
.pin.off{opacity:0;pointer-events:none}

.panel{position:absolute;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:16px;box-shadow:var(--shadow)}
#head{left:12px;top:12px;padding:10px 14px;max-width:calc(100% - 84px)}
#head h1{margin:0;font-size:15px;line-height:1.25;color:var(--navy);font-weight:700}
#head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
#compass{right:12px;top:12px;width:60px;height:60px;border-radius:50%;display:grid;place-items:center}
#compass svg{width:52px;height:52px;transition:transform .05s linear}
#bar{left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:5px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar button{height:36px;padding:0 12px;border-radius:11px;font-weight:600;font-size:13px;color:var(--navy);white-space:nowrap;flex:none}
#bar button:hover{background:var(--navy-tint)}
#bar button.on{background:var(--navy);color:#fff}
#bar .sep{width:1px;background:var(--line);margin:6px 2px;flex:none}
#side{left:12px;top:78px;width:230px;max-height:calc(100% - 160px);display:none;flex-direction:column;overflow:hidden}
#side.open{display:flex}
#side h2{margin:0;padding:12px 14px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
#list{overflow-y:auto;padding:0 6px 6px;overscroll-behavior:contain}
#list button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;text-align:left;font-size:13px}
#list button:hover,#list button.sel{background:var(--navy-tint)}
#list .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
#list .dot.wip{background:var(--wip)}
#list .dot.infra{background:var(--navy)}
#list .dot.navy{background:#0F3F66}#list .dot.bronze{background:#A8742C}
#list span.s{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
#layers{padding:4px 14px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#layers label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
#layers input{accent-color:var(--navy);width:16px;height:16px;margin:0}
#card{right:12px;top:72px;width:290px;padding:16px;display:none}
#card.open{display:block}
#card .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted)}
#card .x:hover{background:var(--navy-tint)}
#card h3{margin:0 28px 2px 0;font-size:19px;line-height:1.2;color:var(--navy)}
#card .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
#card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
#card dt{color:var(--muted)}
#card dd{margin:0;font-weight:600;text-align:right}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#E3F3EA;color:var(--ok)}
.chip.wip{background:#FBEBD3;color:var(--wip)}
#sun{right:12px;bottom:calc(64px + env(safe-area-inset-bottom));width:256px;padding:10px 8px 8px;display:none}
#sun.open{display:block}
#sun .row{display:flex;align-items:baseline;gap:8px;padding:0 6px}
#sun b{font-size:20px;color:var(--navy);font-variant-numeric:tabular-nums}
#sun #sunInfo{font-size:12px;color:var(--muted);flex:1}
#sunPlay{width:28px;height:28px;border-radius:50%;background:var(--navy-tint);color:var(--navy);font-size:11px;align-self:center}
#sunArc{display:block;width:100%;touch-action:none}
.seg{display:flex;gap:4px;padding:2px 4px 0}
.seg button{flex:1;height:28px;border-radius:8px;font-size:12px;font-weight:600;color:var(--navy);white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff}
#hint{left:50%;bottom:calc(66px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 12px;font-size:12px;color:var(--muted);white-space:nowrap;border-radius:20px;transition:opacity .5s;pointer-events:none}
#osm{position:absolute;z-index:4;left:10px;bottom:calc(8px + env(safe-area-inset-bottom));font-size:10px;color:#4a5568;text-decoration:none;background:rgba(255,255,255,.7);padding:1px 6px;border-radius:6px}
@media (max-width:720px){#osm{bottom:auto;top:66px;left:8px}}
#hint{display:none!important}
#guide{left:50%;top:12px;transform:translateX(-50%);width:330px;max-width:calc(100% - 24px);padding:12px 14px 10px;z-index:7;display:none}
#guide.open{display:block;animation:gin .35s ease}
@keyframes gin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
#guide .gt{display:flex;align-items:center;gap:10px}
#guide .gi{width:38px;height:38px;border-radius:50%;background:var(--navy-tint);display:grid;place-items:center;flex:none;transition:background .25s}
#guide .gi svg{width:22px;height:22px;fill:none;stroke:var(--navy);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:gwig 1.6s ease-in-out infinite}
@keyframes gwig{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
#guide.ok .gi{background:#2F8F5B}#guide.ok .gi svg{stroke:#fff;animation:none}
#guide b{display:block;font-size:14px;color:var(--navy);line-height:1.25}
#guide span.gd{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:1px}
#guide .gb{display:flex;align-items:center;gap:6px;margin-top:9px}
#guide .dots{display:flex;gap:5px;flex:1}
#guide .dots i{width:18px;height:4px;border-radius:2px;background:var(--line);transition:background .25s}
#guide .dots i.on{background:var(--navy)}#guide .dots i.done{background:#2F8F5B}
#guide button{height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted)}
#guide button.nx{background:var(--navy);color:#fff}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.0)}50%{box-shadow:0 0 0 4px rgba(242,193,78,.95)}}
@media (max-width:720px){#guide{top:74px}}
#tip{position:absolute;z-index:6;pointer-events:none;padding:4px 9px;border-radius:8px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;display:none;white-space:nowrap;transform:translate(12px,14px)}
#load{position:absolute;inset:0;display:grid;place-items:center;background:#dfeaf0;color:var(--navy);font-weight:600;z-index:9;transition:opacity .4s}
#load.err{color:#a33}
@media (max-width:720px){
  #side{left:8px;right:8px;top:auto;bottom:calc(62px + env(safe-area-inset-bottom));width:auto;max-height:46%}
  #card{left:8px;right:8px;top:auto;bottom:calc(62px + env(safe-area-inset-bottom));width:auto}
  #hint{display:none}
  #sun{right:8px;left:8px;width:auto;max-width:320px;margin:0 auto;bottom:calc(62px + env(safe-area-inset-bottom))}
  #head{left:8px;top:8px}#compass{right:8px;top:8px}
  .pin .b{min-width:28px;height:28px;font-size:12px;padding:0 6px}.pin.home .b{height:24px;font-size:10.5px;padding:0 7px}.pin.street .b{font-size:10px;height:17px;padding:0 6px}.pin .b small{display:none}
  .pin.infra .b{min-width:26px;height:26px}
}
</style>
</head>

    <g font-size="8" font-weight="700" text-anchor="middle" font-family="Onest,sans-serif"><text x="24" y="9" fill="#C2452D">С</text><text x="24" y="46" fill="#2D3C55">Ю</text><text x="43.5" y="27" fill="#2D3C55">В</text><text x="4.5" y="27" fill="#2D3C55">З</text></g></svg></div>
  <div id="side" class="panel"><h2>Объекты</h2><div id="list"></div>
    <div id="layers"><h2 style="padding:8px 0 2px">Слои</h2>

  <div id="sun" class="panel">

      <path id="sunDay" d="" fill="none" stroke="#F2C14E" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="108" x2="232" y2="108" stroke="#E2E0DA"/>
      <text x="20" y="119" font-size="9" text-anchor="middle" fill="#667085">3:00</text><text x="120" y="119" font-size="9" text-anchor="middle" fill="#667085">13:00</text><text x="220" y="119" font-size="9" text-anchor="middle" fill="#667085">23:00</text>
      <g id="sunKnob" style="cursor:grab"><circle r="16" fill="transparent"/><circle id="sunDot" r="9" fill="#F2C14E" stroke="#fff" stroke-width="2"/></g></svg>
    <div class="seg" id="season"><button data-s="summer" class="on">Лето</button><button data-s="equinox">Весна / осень</button><button data-s="winter">Зима</button></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './vendor/OrbitControls.js';

const $=s=>document.querySelector(s);
const mobile=matchMedia('(max-width:720px)').matches||/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
let S,D;
try{
  [S,D]=await Promise.all([fetch('scene.json').then(r=>r.json()),fetch('data.json?'+Date.now()).then(r=>r.json())]);
}catch(e){$('#load').textContent='Не удалось загрузить модель. Обновите страницу.';$('#load').classList.add('err');throw e}
$('#ttl').textContent=D.title;$('#sub').textContent=D.subtitle;
const FX=S.focus[0],FZ=S.focus[1];

/* ---------- renderer ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const SKY=0xdfe9ee;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,900,2700);
const camera=new THREE.PerspectiveCamera(36,1,2,9000);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI/2-.06;controls.minDistance=35;controls.maxDistance=1900;
controls.screenSpacePanning=false;controls.zoomSpeed=.9;controls.rotateSpeed=.55;controls.autoRotateSpeed=.7;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};

const hemi=new THREE.HemisphereLight(0xeaf3ff,0x9aa68a,1.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1dc,2.3);sun.position.set(-520,760,420);sun.castShadow=true;
const sm=mobile?2048:4096;sun.shadow.mapSize.set(sm,sm);
Object.assign(sun.shadow.camera,{left:-560,right:560,top:560,bottom:-560,near:100,far:3800});sun.target.position.set(FX,0,FZ);scene.add(sun.target);sun.shadow.bias=-.0005;sun.shadow.normalBias=.5;
scene.add(sun);

/* sky dome (gradient) + matching environment for reflections */
const skyU={top:{value:new THREE.Color(0x6fa3d8)},hor:{value:new THREE.Color(SKY)}};
const skyMat=new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,hor;varying float h;void main(){float k=pow(clamp(h,0.,1.),.55);gl_FragColor=vec4(mix(hor,top,k),1.);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}'});
const dome=new THREE.Mesh(new THREE.SphereGeometry(6000,24,12),skyMat);dome.renderOrder=-1;scene.add(dome);
{const es=new THREE.Scene();const m=new THREE.ShaderMaterial({side:THREE.BackSide,
    vertexShader:'varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 d;void main(){vec3 n=normalize(d);float k=pow(clamp(n.y,0.,1.),.5);vec3 c=mix(vec3(1.25,1.3,1.35),vec3(.42,.66,1.05),k);c=mix(vec3(.34,.4,.3),c,smoothstep(-.08,.02,n.y));c+=vec3(9.,8.,6.5)*pow(max(dot(n,normalize(vec3(-.5,.62,.45))),0.),90.);gl_FragColor=vec4(c,1.);}'});
  es.add(new THREE.Mesh(new THREE.SphereGeometry(50,24,12),m));
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(es,0,1,200).texture;pm.dispose();m.dispose()}

/* ---------- helpers ---------- */
const M4=new THREE.Matrix4(),Q=new THREE.Quaternion(),V=new THREE.Vector3(),SC=new THREE.Vector3(),UP=new THREE.Vector3(0,1,0),COL=new THREE.Color();
const lam=(c,o={})=>new THREE.MeshLambertMaterial({color:c,...o});
const envMats=[];   // materials whose reflections follow the time of day
const std=(c,o={})=>{const m=new THREE.MeshStandardMaterial({color:c,roughness:.85,metalness:0,envMapIntensity:.55,...o});m.userData.env=m.envMapIntensity;envMats.push(m);return m};
function shape(poly,holes){const s=new THREE.Shape(poly.map(p=>new THREE.Vector2(p[0],-p[1])));
  (holes||[]).forEach(h=>s.holes.push(new THREE.Path(h.map(p=>new THREE.Vector2(p[0],-p[1])))));return s}
function merge(geos){
  let n=0;geos.forEach(g=>n+=g.attributes.position.count);
  const out=new THREE.BufferGeometry();
  for(const k of Object.keys(geos[0].attributes)){const sz=geos[0].attributes[k].itemSize;const a=new Float32Array(n*sz);let o=0;
    geos.forEach(g=>{a.set(g.attributes[k].array,o);o+=g.attributes[k].count*sz});out.setAttribute(k,new THREE.BufferAttribute(a,sz))}
  return out}
function flat(polys,color,y,opt={}){ // polys: [poly] or [{o,i}]; opt.tex -> world-space UVs
  const gs=[];for(const p of polys){const o=p.o||p,i=p.i||[];if(o.length<3)continue;
    try{let g=new THREE.ShapeGeometry(shape(o,i));g=g.toNonIndexed();g.deleteAttribute('uv');gs.push(g)}catch(e){}}
  if(!gs.length)return null;const g=merge(gs);g.rotateX(-Math.PI/2);g.translate(0,y,0);
  if(opt.tex){const p=g.attributes.position.array,uv=new Float32Array(p.length/3*2),k=opt.k||.25;for(let i=0;i<p.length/3;i++){uv[i*2]=p[i*3]*k;uv[i*2+1]=p[i*3+2]*k}g.setAttribute('uv',new THREE.BufferAttribute(uv,2))}
  const m=new THREE.Mesh(g,opt.material||lam(color,{map:opt.tex||null,...opt.mat}));m.receiveShadow=true;scene.add(m);return m}
function ribbon(lines,color,y,group,mat){ // lines: [{p,w}]
  const pos=[];
  for(const {p,w} of lines){if(p.length<2)continue;const L=[],R=[];
    for(let i=0;i<p.length;i++){const a=p[Math.max(0,i-1)],b=p[Math.min(p.length-1,i+1)];let dx=b[0]-a[0],dz=b[1]-a[1];const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
      L.push([p[i][0]-dz*w/2,p[i][1]+dx*w/2]);R.push([p[i][0]+dz*w/2,p[i][1]-dx*w/2])}
    for(let i=0;i<p.length-1;i++){pos.push(L[i][0],y,L[i][1],L[i+1][0],y,L[i+1][1],R[i][0],y,R[i][1],R[i][0],y,R[i][1],L[i+1][0],y,L[i+1][1],R[i+1][0],y,R[i+1][1])}}

  cA.copy(skyNight).lerp(skyDay,day).lerp(skyDusk,dusk*.8*(1-night*.55));scene.background.copy(cA);scene.fog.color.copy(cA);skyU.hor.value.copy(cA);
  skyU.top.value.copy(topNight).lerp(topDay,day).lerp(cB.setHex(0x6a6fa8),dusk*.35);

  for(const m of envMats)m.envMapIntensity=m.userData.env*(.1+.9*day);

  const dirs=['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'],azd=((az*180/Math.PI)%360+360)%360;
  $('#sunInfo').textContent=deg>0?`солнце на ${dirs[Math.round(azd/45)%8]}, ${Math.round(deg)}° над горизонтом`:'солнце зашло';
  const[x,y]=arcXY(sunT);$('#sunKnob').setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)})`);$('#sunDot').setAttribute('fill',deg>0?'#F2C14E':'#8fa0c4');
  let a=null,b=null;for(let t=T0;t<=T1+.001;t+=.1){if(sunPos(t,season).el>0){if(a===null)a=t;b=t}}
  if(a!==null){const p=arcXY(a),q=arcXY(b);$('#sunDay').setAttribute('d',`M${p[0].toFixed(1)} ${p[1].toFixed(1)}A100 100 0 0 1 ${q[0].toFixed(1)} ${q[1].toFixed(1)}`)}else $('#sunDay').setAttribute('d','')}

  const a=Math.atan2(Math.max(0,y),x);sunT=Math.round((T0+(1-a/Math.PI)*(T1-T0))*12)/12;sunGoal=null;eveBack=null;applySun();guideDone(3)}
{const arc=$('#sunArc');let drag=false;

  $('#sunPlay').onclick=()=>{guideDone(3);sunAnim=!sunAnim;sunGoal=null;$('#sunPlay').textContent=sunAnim?'❚❚':'▶';if(sunAnim&&sunT>=T1-.05)sunT=T0}}
let lastSun=0;function stepSun(){const n=performance.now();if(n-lastSun<33)return;const dt=Math.min(.5,(n-lastSun)/1000);lastSun=n;
  if(sunGoal!==null){const dlt=sunGoal-sunT,st=dt*5;if(Math.abs(dlt)<=st){sunT=sunGoal;sunGoal=null}else sunT+=Math.sign(dlt)*st;applySun();return}
  sunT+=.05;if(sunT>=T1){sunT=T1;sunAnim=false;$('#sunPlay').textContent='▶'}applySun()}
applySun();if(innerWidth>=1100)$('#sun').classList.add('open');

/* ---------- interactive how-to: each step is ticked off when the visitor actually does it ---------- */
const GI={rot:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>',zoom:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3M8.5 11h5M11 8.5v5"/></svg>',
  tap:'<svg viewBox="0 0 24 24"><path d="M4 20V10l5-3 5 3v10M9 20v-5M14 13h6v7"/></svg>',sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>',ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
const touch=matchMedia('(pointer:coarse)').matches;   // wording by input device, not by frame width
const GUIDE=[{i:'rot',t:'Покрутите модель',d:touch?'Проведите пальцем по экрану':'Зажмите левую кнопку мыши и потяните'},
  {i:'zoom',t:'Приблизьте',d:touch?'Сведите или разведите два пальца':'Колесо мыши — масштаб, правая кнопка — сдвиг'},
  {i:'tap',t:'Нажмите на дом',d:'Откроется карточка: срок сдачи, этажность, класс'},
  {i:'sun',t:'Откройте «Солнце»',d:'Подвиньте солнце по дуге — тени покажут, где свет в разное время дня',pulse:'[data-a=sun]'}];
const gEl=$('#guide');let gStep=-1,gTimer=0;
function guideShow(i){clearTimeout(gTimer);document.querySelectorAll('.pulse').forEach(e=>e.classList.remove('pulse'));gStep=i;
  if(i<0||i>GUIDE.length){gEl.classList.remove('open');gStep=-1;return}
  const end=i===GUIDE.length,g=end?{i:'ok',t:'Готово!',d:'Камеры и облёт — на нижней панели. Подсказку можно открыть кнопкой «?»'}:GUIDE[i];
  gEl.classList.toggle('ok',end);gEl.querySelector('.gi').innerHTML=GI[g.i];gEl.querySelector('b').textContent=g.t;gEl.querySelector('.gd').textContent=g.d;
  gEl.querySelector('.dots').innerHTML=GUIDE.map((_,k)=>`<i class="${k<i?'done':k===i?'on':''}"></i>`).join('');
  gEl.querySelector('.sk').style.display=end?'none':'';gEl.querySelector('.nx').textContent=end?'Закрыть':'Далее';
  if(g.pulse)document.querySelector(g.pulse).classList.add('pulse');
  gEl.classList.remove('open');void gEl.offsetWidth;gEl.classList.add('open');
  if(end){try{localStorage.setItem('riv3d-guide','1')}catch(e){}gTimer=setTimeout(()=>guideShow(-1),5000)}}
function guideDone(i){if(i!==gStep)return;gEl.classList.add('ok');gEl.querySelector('.gi').innerHTML=GI.ok;gStep=-2;gTimer=setTimeout(()=>guideShow(i+1),800)}
gEl.querySelector('.nx').onclick=()=>guideShow(gStep<0?-1:gStep+1);
gEl.querySelector('.sk').onclick=()=>{try{localStorage.setItem('riv3d-guide','1')}catch(e){}guideShow(-1)};
gEl.addEventListener('pointerdown',e=>e.stopPropagation());
{let seen=false;try{seen=!!localStorage.getItem('riv3d-guide')}catch(e){}if(!seen)setTimeout(()=>guideShow(0),900)}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;
function hit(e){const r=canvas.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);
  const h=ray.intersectObjects(pick,false)[0];return h?h.object.userData.id:null}
let touches=0;canvas.addEventListener('pointerup',()=>touches=Math.max(0,touches-1));canvas.addEventListener('pointercancel',()=>touches=0);
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&++touches>1)guideDone(1);down=[e.clientX,e.clientY];fly=null;$('#hint').style.opacity=0;if(controls.autoRotate)stopOrbit()});
canvas.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(moved>6){guideDone(0);return}const id=hit(e);if(id&&obj(id))select(id);else if(!id)select(null,false)});
const tip=$('#tip');
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||down)return;const id=hit(e),ok=id&&obj(id)?id:null;
  if(ok!==hovered){hovered=ok;refreshTint();canvas.style.cursor=ok?'pointer':'grab'}
  if(ok){tip.textContent=obj(ok).title;tip.style.display='block';tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px'}else tip.style.display='none'});
canvas.addEventListener('pointerleave',()=>{tip.style.display='none';if(hovered){hovered=null;refreshTint()}});
canvas.addEventListener('wheel',()=>{guideDone(1);fly=null;$('#hint').style.opacity=0},{passive:true});
addEventListener('keydown',e=>{if(e.key==='Escape')select(null,false)});

/* ---------- light post-processing: soft bloom + vignette (desktop only) ---------- */
const fx=mobile?null:(()=>{
  const rt=new THREE.WebGLRenderTarget(4,4,{type:THREE.HalfFloatType,samples:4}),b1=new THREE.WebGLRenderTarget(4,4,{type:THREE.HalfFloatType}),b2=b1.clone();
  const cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1),quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2));quad.frustumCulled=false;
  const vs='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
  const mk=(u,fs,tm)=>new THREE.ShaderMaterial({uniforms:u,vertexShader:vs,fragmentShader:fs,depthTest:false,depthWrite:false,toneMapped:!!tm});
  const bright=mk({t:{value:null}},'uniform sampler2D t;varying vec2 vUv;void main(){vec3 c=texture2D(t,vUv).rgb;float l=max(c.r,max(c.g,c.b));gl_FragColor=vec4(c*smoothstep(.8,1.5,l),1.);}');
  const blur=mk({t:{value:null},d:{value:new THREE.Vector2()}},'uniform sampler2D t;uniform vec2 d;varying vec2 vUv;void main(){vec3 c=texture2D(t,vUv).rgb*.227;c+=(texture2D(t,vUv+d*1.385).rgb+texture2D(t,vUv-d*1.385).rgb)*.316;c+=(texture2D(t,vUv+d*3.231).rgb+texture2D(t,vUv-d*3.231).rgb)*.07;gl_FragColor=vec4(c,1.);}');
  const comp=mk({t:{value:null},b:{value:null},k:{value:.5}},'uniform sampler2D t,b;uniform float k;varying vec2 vUv;void main(){vec3 c=texture2D(t,vUv).rgb+texture2D(b,vUv).rgb*k;vec2 q=vUv-.5;c*=1.-.42*dot(q,q);gl_FragColor=vec4(c,1.);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}',true);
  const pass=(m,target)=>{quad.material=m;renderer.setRenderTarget(target);renderer.render(quad,cam)};
  return{size(w,h){rt.setSize(w,h);const q=Math.max(2,w>>2),r=Math.max(2,h>>2);b1.setSize(q,r);b2.setSize(q,r)},
    render(){renderer.setRenderTarget(rt);renderer.render(scene,camera);
      bright.uniforms.t.value=rt.texture;pass(bright,b1);
      for(let i=0;i<2;i++){blur.uniforms.t.value=b1.texture;blur.uniforms.d.value.set((1+i)/b1.width,0);pass(blur,b2);blur.uniforms.t.value=b2.texture;blur.uniforms.d.value.set(0,(1+i)/b1.height);pass(blur,b1)}
      comp.uniforms.t.value=rt.texture;comp.uniforms.b.value=b1.texture;comp.uniforms.k.value=.45+.55*nightK;pass(comp,null)}}})();

/* ---------- loop ---------- */
let viewInit=false;
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return; // hidden / lazy iframe: wait for a real size
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  if(fx){const pr=renderer.getPixelRatio();fx.size(Math.round(w*pr),Math.round(h*pr))}
  if(!viewInit){viewInit=true;setView('main',true)}}
addEventListener('resize',resize);new ResizeObserver(resize).observe(canvas);resize();
const needle=$('#compass svg'),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
renderer.setAnimationLoop(()=>{
  if(!viewInit)return;
  if(fly){const k=Math.min(1,(performance.now()-fly.s)/fly.ms),e=ease(k);camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(k>=1)fly=null}
  controls.target.x=THREE.MathUtils.clamp(controls.target.x,FX-650,FX+650);controls.target.z=THREE.MathUtils.clamp(controls.target.z,FZ-600,FZ+600);controls.target.y=THREE.MathUtils.clamp(controls.target.y,0,60);
  controls.update();
  needle.style.transform=`rotate(${THREE.MathUtils.radToDeg(controls.getAzimuthalAngle())}deg)`;if(sunAnim||sunGoal!==null)stepSun();
  if(fx)fx.render();else renderer.render(scene,camera);placePins()});
window.__ready=true;window.__dbg={scene,camera,controls,renderer,select,setView,S,D,setSun:(t,se)=>{sunT=t;if(se)season=se;applySun()}};
const ld=$('#load');ld.style.opacity=0;setTimeout(()=>ld.remove(),450);setTimeout(()=>$('#hint').style.opacity=0,9000);
</script>
